site:
  name: Arun Iron Works
  site: 'https://www.arunironworks.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Arun Iron Works
    template: '%s — Arun Iron Works'
  description: "Pressure vessel and heat exchanger manufacturer in Vadodara, Gujarat. Heavy fabrication for pharma, chemicals, fertilizers, and process industries since 1957."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Arun Iron Works
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # Add your GA4 ID here later e.g. "G-XXXXXXXXXX"

ui:
  theme: 'light:only'